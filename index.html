<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CATlandar</title>
  <link rel="preload" as="image" href="img/hero.webp">
  <link rel="icon" href="icons/cat.svg" type="image/svg+xml">
  <link rel="icon" href="icons/cat-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/cat-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;800&family=Noto+Sans+TC:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // 開啟前先套上次的深淺與主題色，避免閃一下別的底色
    try { const l = JSON.parse(localStorage.getItem('calapp.look')); const d = document.documentElement.dataset;
      d.accent = l.a; d.font = l.f; d.theme = l.m === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : l.m; } catch {}
  </script>
</head>
<body>
  <div id="app" class="intro-hide"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
